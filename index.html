<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Green API</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #fff;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .left {
            width: 280px;
        }

        .right {
            flex: 1;
        }

        input,
        textarea,
        button {
            width: 100%;
            font-size: 14px;
            font-family: inherit;
        }

        input {
            height: 38px;
            padding: 8px 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }

        button {
            height: 42px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f7f7f7;
            cursor: pointer;
        }

        button:hover {
            background: #eaeaea;
        }

        .section {
            margin-top: 35px;
        }

        .section:first-of-type {
            margin-top: 25px;
        }

        .message {
            height: 80px;
            resize: none;
        }

        .response-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .response {
            width: 100%;
            height: 570px;
            font-family: Consolas, monospace;
            font-size: 14px;
            background: #fafafa;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Левая часть -->
        <div class="left">

            <!-- Авторизация -->
            <input type="text" id="idInstance" placeholder="idInstance">

            <input type="text" id="apiTokenInstance" placeholder="ApiTokenInstance">

            <button onclick="getSettings()">
                getSettings
            </button>

            <button onclick="getStateInstance()">
                getStateInstance
            </button>


            <!-- Отправка сообщения -->
            <div class="section">

                <input type="text" id="phone" placeholder="77771234567">

                <textarea id="message" class="message" placeholder="Hello World!"></textarea>

                <button onclick="sendMessage()">
                    sendMessage
                </button>

            </div>


            <!-- Отправка файла -->
            <div class="section">

                <input type="text" id="phone" placeholder="77771234567">

                <input type="text" id="fileName" placeholder="File Name">

                <input type="text" id="caption" placeholder="Caption">

                <input type="text" id="fileUrl" placeholder="https://my.site.com/img/horse.png">

                <button onclick="sendFileByUrl()">
                    sendFileByUrl
                </button>

            </div>

        </div>


        <!-- Правая часть -->
        <div class="right">

            <div class="response-title">
                Ответ:
            </div>

            <textarea id="response" class="response" readonly></textarea>

        </div>

    </div>


    <script>
        const apiUrl = 'https://4100.api.green-api.com';

        function getCredentials() {
            return {
                idInstance: document.getElementById('idInstance').value.trim(),
                apiTokenInstance: document.getElementById('apiTokenInstance').value.trim()
            };
        }

        function showResponse(data) {
            document.getElementById("response").value =
                JSON.stringify(data, null, 4);
        }


        async function getSettings() {

            const { idInstance, apiTokenInstance } = getCredentials();

            try {
                const url = `${apiUrl}/waInstance${idInstance}/getSettings/${apiTokenInstance}`;
                const response = await fetch(url);
                const data = await response.json();

                showResponse(data);
            } catch (error) {
                showResponse({ error: error.message });
            }
        }


        async function getStateInstance() {

            const { idInstance, apiTokenInstance } = getCredentials();

            try {
                const url = `${apiUrl}/waInstance${idInstance}/getStateInstance/${apiTokenInstance}`;
                const response = await fetch(url);
                const data = await response.json();

                showResponse(data);
            } catch (error) {
                showResponse({ error: error.message });
            }

        }


        async function sendMessage() {

            const phone = document.getElementById("phone").value;
            const message = document.getElementById("message").value;
            const { idInstance, apiTokenInstance } = getCredentials();

            const chatId = `${phone.replace(/\D/g, '')}@c.us`;

            try {
                const url = `${apiUrl}/waInstance${idInstance}/sendMessage/${apiTokenInstance}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ chatId, message })
                });
                const data = await response.json();

                showResponse(data);
            } catch (error) {
                showResponse({ error: error.message });
            }
        }


        async function sendFileByUrl() {
            const { idInstance, apiTokenInstance } = getCredentials();

            const phone = document.getElementById("phone").value;
            const phoneNumber = phone.replace(/\D/g, '');


            const urlFile = document.getElementById('fileUrl').value.trim();
            const fileName = document.getElementById('fileName').value.trim();
            const caption = document.getElementById('caption').value.trim();


            const chatId = `${phoneNumber}@c.us`;
            const url = `${apiUrl}/waInstance${idInstance}/sendFileByUrl/${apiTokenInstance}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId, urlFile, fileName, caption })
                });

                showResponse(await response.json());
            } catch (error) {
                showResponse({ error: error.message });
            }
        }


    </script>

</body>

</html>
